name: Build WASM plugin package

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wasm:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUST_VERSION: '1.93.1'
      TARGET: wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Rust and WASM target
        run: rustup toolchain install "$RUST_VERSION" --profile minimal --target "$TARGET"
      - name: Test and build
        run: |
          cargo +"$RUST_VERSION" test --locked --manifest-path wasm/Cargo.toml
          cargo +"$RUST_VERSION" build --locked --manifest-path wasm/Cargo.toml --release --target "$TARGET"
      - name: Verify and package
        run: |
          node scripts/verify-wasm.mjs
          python scripts/package.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: plugin-wasm
          path: dist/*.zip*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
