[workspace]
resolver = "2"
members = ["sdk"]

[package]
name = "agent2api-wasm-wps-lingxi"
version = "0.1.3"
edition = "2021"
rust-version = "1.88"
license-file = "../LICENSE"

[lib]
name = "wps_lingxi"
crate-type = ["cdylib"]

[dependencies]
agent2api-wasm-sdk = { path = "sdk" }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "s"
strip = true
